id = "fullbright"
name = "Fullbright"
version = "1.0.3"
description = "Press G to toggle full brightness in single-player and multiplayer."
authors = ["C0lor4"]
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f00125f61f794aaa3d4e950d301f353b35b6ee3d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "apply_brightness"
target = "horizon_client::game::options::Game<'_>::hold_fullbright"
kind = "RETURN"
helper = "src/mixins/brightness.rs"
bindings = [
    { name = "unit", ty = "()", value = "$value" },
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

# Keep the game's API-value visibility shim at the same location for this build.
[[native.module]]
id = "fullbright_nightly_scope"
file = "crates/horizon-client/src/game/modding/api_values/block_state.rs"
name = "fullbright_nightly_scope"
source = "src/nightly_scope.rs"
